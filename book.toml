[book]
title = "Software Developer"
authors = ["Sven Imholz"]
description = "Studentensite van de opleiding Software Development, Firda Sneek"
language = "nl"
src = "src"

[build]
create-missing = false
build-dir = "book"

[output.html]
site-url = "/software-developer/"
git-repository-url = "https://github.com/Firda-Sneek/software-developer"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/css/firda.css"]
additional-js = ["theme/firda.js"]
