[book]
title = "Software Developer"
authors = ["Sven Imholz"]
description = "Studentensite van de opleiding Software Development, Firda Sneek"
language = "nl"
src = "src"

[build]
# Ontbrekende pagina's uit src/SUMMARY.md worden bij de build aangemaakt.
create-missing = true
build-dir = "book"

# Vult {{#include pad:regionnaam}} uit `#region`-markers in de bronbestanden.
# Draait vóór de ingebouwde links-preprocessor. Vereist rust-script (mise install).
[preprocessor.regions]
command = "rust-script scripts/regions.rs preprocess"
before = ["links"]

[output.html]
site-url = "/software-developer/"
git-repository-url = "https://github.com/Firda-Sneek/software-developer"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
# Vaste bestandsnamen: firda.css verwijst naar de fonts in book/fonts/ zonder hash.
hash-files = false
additional-css = ["theme/css/firda.css", "theme/css/print.css"]
additional-js = ["theme/firda.js", "theme/print-datum.js"]

[output.html.print]
enable = false
