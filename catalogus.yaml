# Catalogus van de studentensite.
# scripts/genereer-summary.py schrijft hieruit src/SUMMARY.md.
# Zet geen YAML-frontmatter in de Markdown-pagina's: mdBook toont die als tekst.
#
# Velden per item:
#   titel     — tekst in de sidebar (verplicht als er een bestand is)
#   bestand   — pad t.o.v. src/, bijvoorbeeld jaren/sd1.md
#   kop       — sectiekop in SUMMARY.md (geen eigen pagina)
#   kinderen  — geneste items
#
# 404.md hoort niet in deze lijst; mdBook gebruikt die pagina automatisch.

paginas:
  - titel: Start
    bestand: index.md
  - kop: Jaren
    kinderen:
      - titel: SD1
        bestand: jaren/sd1.md
      - titel: SD2
        bestand: jaren/sd2.md
  - kop: Reeksen
    kinderen:
      - titel: Voorbeeldreeks
        bestand: reeksen/voorbeeld/index.md
        kinderen:
          - titel: Voorbeeldhandout
            bestand: reeksen/voorbeeld/handout-voorbeeld.md
  - kop: Projectdocumentatie
    kinderen:
      - titel: Overzicht
        bestand: projectdocumentatie/index.md
  - kop: Projectopdrachten
    kinderen:
      - titel: Overzicht
        bestand: projectopdrachten/index.md
