[tools]
python = "3.12"
uv = "latest"
mdbook = "0.5.4"

[tasks.summary]
description = "Genereer src/SUMMARY.md uit catalogus.yaml"
run = "uv run --script scripts/genereer-summary.py"

[tasks.fonts]
description = "Download en subset de Firda-fonts naar theme/fonts/"
run = "uv run --script scripts/fonts.py"

[tasks.qr]
description = "Zet printfooter met QR in de gebouwde HTML en kopieer fonts"
run = "uv run --script scripts/voeg-print-qr-toe.py"
